[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyera-dspm-automation"
version = "1.0.0"
description = "Pytest + Playwright automation framework for Cyera DSPM home assignment"
requires-python = ">=3.10"
dependencies = [
    "playwright==1.49.1",
    "pytest==8.3.4",
]

[tool.setuptools]
py-modules = ["api_helpers", "shared", "ui_helpers"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --disable-warnings"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "ui: UI tests through the frontend",
    "api: REST API tests",
    "e2e: end-to-end business workflow tests",
    "known_issue: known product behavior that is intentionally documented",
]
